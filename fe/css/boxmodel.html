<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

            /* 기본 베이스 설정 */
        * {
            margin : 0; /* 외부여백 0 */
            padding : 0; /* 내부여백 0 */
            box-sizing : border-box;
            /* 박스모델 사이즈 지정 시, border 까지 사이즈로 인식 */
        }


        .box {width : 200px;
                height : 100px;
                border : 1px solid black

                
                margin 10px;
                padding : 10px;
                }





        .box1 {
            /* div 태그 기본 성격 block */

            display : none;
        }

        .box2 {
            
            
            display : block;
            
            /* margin : 50px;
            padding-left : 30px;
            padding-top : 20px;
            padding-right : 30px;
            padding-bottom : 20px;
            border-width : 3px;
            border-style : dashed;
            border-color : red;

            width : 200px;
            height : 150px; */

            /* box-sizing : border-box; */
            /* box-sizing : content-box; */

            /* display 속성
            display : block;  기본값,한줄 다 차지
            display : inline-block; 글자랑 같이 있긴 한데 글자 밀어냄
            display : inline; 컨텐츠 크기만큼만 차지
            display : none;  화면에 표시되지 않음
            */
        }

        .box3 {
            
            display : inline;

        }

        .box4 {
            
            display : inline-block;

        }

        .parent {
            width : 200px;
            height : 100px;
            border : 1px solid blue;
        }

        .child {
            width : 100px;
            height : 50px;
            border : 1px solid red;
        }

        .parent :hover .child .parent -span {
            color : blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box1">
        box1   
    </div>
    <div class="box2">
        box2
    </div>
    <div class="box3">
        box3
    </div>
                <span>span태그 아아아아아아아아아아아아아아아아아
            아아아아아아아아아아아아아아아아아아아아아아아아아아아
            아아아아아아아아아아아아</span>
    <p> 다른 요소 p태그</p>

    <div class="box4">
        box4
    </div>
    <span>아아아아아아아아아아아아아아아아아아아아아아아아아아아</span>

    <div class="parent">
        <span class="parent-span"> 부모</span>
        <br>
        <br>
        <div class="child">
        자식
        </div>
</body>
</html>
