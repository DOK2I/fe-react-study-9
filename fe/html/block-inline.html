<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 블록요소 vs 인라인요소 -->
    <!-- p 태그  span 태그 -->

    <p>p첫번째 블록 요소</p>
    <p>p두번째 블록 요소</p>
    <span>span첫번째 인라인 요소</span>
    <span>span두번째 인라인 요소</span>
    <p>p세번째 블록 요소</p>
    <span>span세번째 인라인 요소</span>

</body>
</html>
